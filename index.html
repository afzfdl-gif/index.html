<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>

  <!-- Google Fonts: Inter (300-700) & Instrument Serif (400 regular & italic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: 'hsl(var(--bg))',
            surface: 'hsl(var(--surface))',
            'text-primary': 'hsl(var(--text))',
            muted: 'hsl(var(--muted))',
            stroke: 'hsl(var(--stroke))',
            accent: 'hsl(var(--accent))',
          },
          fontFamily: {
            body: ['Inter', 'sans-serif'],
            display: ['Instrument Serif', 'serif'],
          },
        },
      },
    };
  </script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Framer Motion -->
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@11.0.8/dist/framer-motion.js"></script>

  <!-- hls.js for HLS Video Streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>

  <style>
    /* ==========================================================================
       1. GLOBAL DESIGN SYSTEM & HSL TOKENS
       ========================================================================== */
    :root {
      --bg: 0 0% 4%;
      --surface: 0 0% 8%;
      --text: 0 0% 96%;
      --muted: 0 0% 53%;
      --stroke: 0 0% 12%;
      --accent: 0 0% 96%;
      --font-body: 'Inter', sans-serif;
      --font-display: 'Instrument Serif', serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background-color: hsl(var(--bg));
      color: hsl(var(--text));
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: hsl(var(--bg));
    }
    ::-webkit-scrollbar-thumb {
      background: hsl(var(--stroke));
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4E85BF;
    }

    /* Accent Gradient Utility */
    .accent-gradient {
      background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
    }

    .accent-gradient-reverse {
      background: linear-gradient(270deg, #89AACC 0%, #4E85BF 100%);
    }

    .accent-gradient-animated {
      background: linear-gradient(90deg, #89AACC 0%, #4E85BF 50%, #89AACC 100%);
      background-size: 200% 200%;
      animation: gradient-shift 6s ease infinite;
    }

    /* ==========================================================================
       2. REQUIRED KEYFRAME ANIMATIONS
       ========================================================================== */
    @keyframes scroll-down {
      0% {
        transform: translateY(-100%);
      }
      100% {
        transform: translateY(200%);
      }
    }

    @keyframes role-fade-in {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes gradient-shift {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .animate-scroll-down {
      animation: scroll-down 1.5s ease-in-out infinite;
    }

    .animate-role-fade-in {
      animation: role-fade-in 0.4s ease-out forwards;
    }

    .animate-gradient-shift {
      background-size: 200% 200%;
      animation: gradient-shift 6s ease infinite;
    }

    /* Subtle Cosmic Ambient Mesh Fallback behind HLS stream */
    .cosmic-ambient-bg {
      background:
        radial-gradient(circle at 50% 35%, rgba(78, 133, 191, 0.22) 0%, rgba(137, 170, 204, 0.06) 35%, rgba(10, 10, 10, 0.96) 75%),
        radial-gradient(circle at 20% 80%, rgba(137, 170, 204, 0.1) 0%, transparent 50%),
        hsl(var(--bg));
    }

    /* Halftone Overlay Pattern */
    .halftone-overlay {
      background-image: radial-gradient(circle, #000 1px, transparent 1px);
      background-size: 4px 4px;
    }
  </style>
</head>

    function HlsBackgroundVideo({ flipped = false, overlayClass = 'bg-black/20' }) {
      const videoRef = useRef(null);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        let hls = null;

        if (window.Hls && window.Hls.isSupported()) {
          hls = new window.Hls({
            enableWorker: true,
            lowLatencyMode: false,
          });
          hls.loadSource(HLS_STREAM_URL);
          hls.attachMedia(video);
          hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = HLS_STREAM_URL;
          video.addEventListener('loadedmetadata', () => {
            video.play().catch(() => {});
          });
        }

        return () => {
          if (hls) {
            hls.destroy();
          }
        };
      }, []);

      return (
        <div className="absolute inset-0 overflow-hidden pointer-events-none cosmic-ambient-bg">
          <video
            ref={videoRef}
            autoPlay
            muted
            loop
            playsInline
            className={`absolute top-1/2 left-1/2 min-w-full min-h-full w-auto h-auto object-cover -translate-x-1/2 -translate-y-1/2 ${
              flipped ? 'scale-y-[-1]' : ''
            }`}
          />
          <div className={`absolute inset-0 ${overlayClass}`} />
        </div>
      );
    }

    /* ==========================================================================
       7. SECTION 1: LOADING SCREEN (000 -> 100 OVER 2700MS)
       ========================================================================== */
    function LoadingScreen({ onComplete }) {
      const [count, setCount] = useState(0);
      const [wordIndex, setWordIndex] = useState(0);
      const words = ['Design', 'Create', 'Inspire'];

      // Rotate words every 900ms
      useEffect(() => {
        const interval = setInterval(() => {
          setWordIndex((prev) => (prev + 1) % words.length);
        }, 900);
        return () => clearInterval(interval);
      }, []);

      // requestAnimationFrame counter from 000 -> 100 over 2700ms
      useEffect(() => {
        const duration = 2700;
        let startTime = null;
        let rafId = null;
        let timeoutId = null;

        const tick = (now) => {
          if (!startTime) startTime = now;
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          const nextVal = Math.floor(progress * 100);
          setCount(nextVal);

          if (progress < 1) {
            rafId = requestAnimationFrame(tick);
          } else {
            timeoutId = setTimeout(() => {
              if (onComplete) onComplete();
            }, 400);
          }
        };

        rafId = requestAnimationFrame(tick);

        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          if (timeoutId) clearTimeout(timeoutId);
        };
      }, [onComplete]);

      return (
        <div className="fixed inset-0 z-[9999] bg-bg flex flex-col justify-between p-6 md:p-10 select-none">
          {/* Top-left: "BangZrul • Portfolio" label */}
          <motion.div
            initial={{ y: -20, opacity: 0 }}
            animate={{ y: 0, opacity: 1 }}
            transition={{ duration: 0.6, ease: 'easeOut' }}
            className="text-xs text-muted uppercase tracking-[0.3em]"
          >
            BangZrul • Portfolio
          </motion.div>

          {/* Center: Rotating words ["Design", "Create", "Inspire"] */}
          <div className="flex items-center justify-center my-auto overflow-hidden h-24 md:h-32">
            <AnimatePresence mode="wait">
              <motion.span
                key={words[wordIndex]}
                initial={{ y: 20, opacity: 0 }}
                animate={{ y: 0, opacity: 1 }}
                exit={{ y: -20, opacity: 0 }}
                transition={{ duration: 0.35, ease: [0.22, 1, 0.36, 1] }}
                className="text-4xl md:text-6xl lg:text-7xl font-display italic text-text-primary/80 inline-block"
              >
                {words[wordIndex]}
              </motion.span>
            </AnimatePresence>
          </div>

          {/* Bottom-right: Counter display 000 -> 100 */}
          <div className="flex justify-end items-end pb-2">
            <span className="text-6xl md:text-8xl lg:text-9xl font-display text-text-primary tabular-nums leading-none">
              {String(count).padStart(3, '0')}
            </span>
          </div>

          {/* Bottom progress bar */}
          <div className="fixed bottom-0 left-0 right-0 h-[3px] bg-stroke/50">
            <div
              className="h-full w-full accent-gradient origin-left transition-transform duration-75 ease-out"
              style={{
                transform: `scaleX(${count / 100})`,
                boxShadow: '0 0 8px rgba(137, 170, 204, 0.35)',
              }}
            />
          </div>
        </div>
      );
    }

    function ModalBackdrop({ onClose, children, maxWidth = 'max-w-3xl' }) {
      useEffect(() => {
        const handleKey = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [onClose]);

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-xl flex items-center justify-center p-4 sm:p-6 overflow-y-auto"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className={`relative w-full ${maxWidth} bg-surface border border-stroke rounded-3xl overflow-hidden shadow-2xl my-auto`}
          >
            <button
              type="button"
              onClick={onClose}
              aria-label="Close modal"
              className="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-bg/80 border border-stroke text-muted hover:text-text-primary flex items-center justify-center text-sm transition-colors cursor-pointer"
            >
              ✕
            </button>
            {children}
          </div>
        </div>
      );
    }

    /* ==========================================================================
       17. MAIN APP ORCHESTRATION
       ========================================================================== */
    function App() {
      const [isLoading, setIsLoading] = useState(true);
      const [activeSection, setActiveSection] = useState('home');
      const [selectedProject, setSelectedProject] = useState(null);
      const [selectedArticle, setSelectedArticle] = useState(null);
      const [selectedExplorationIdx, setSelectedExplorationIdx] = useState(null);
      const [isResumeOpen, setIsResumeOpen] = useState(false);

      // Track active scroll section for floating navbar highlight
      useEffect(() => {
        const handleScroll = () => {
          const workEl = document.getElementById('work');
          const journalEl = document.getElementById('journal');
          const scrollPos = window.scrollY + 260;

          if (journalEl && scrollPos >= journalEl.offsetTop) {
            setActiveSection('journal');
          } else if (workEl && scrollPos >= workEl.offsetTop) {
            setActiveSection('work');
          } else {
            setActiveSection('home');
          }
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const handleLoadingComplete = useCallback(() => {
        setIsLoading(false);
        // Refresh ScrollTrigger measurements after loader unmounts
        setTimeout(() => {
          if (window.ScrollTrigger) {
            window.ScrollTrigger.refresh();
          }
        }, 120);
      }, []);

      const handleNavigateLightbox = (delta) => {
        setSelectedExplorationIdx((prev) => {
          if (prev === null) return null;
          const next =
            (prev + delta + EXPLORATION_ITEMS.length) % EXPLORATION_ITEMS.length;
          return next;
        });
      };

      return (
        <div className="min-h-screen bg-bg text-text-primary font-body">
          {/* Section 1: Loading Screen */}
          {isLoading && <LoadingScreen onComplete={handleLoadingComplete} />}

          {/* Floating Top-Center Pill Navbar */}
          <FloatingNavbar
            activeSection={activeSection}
            onOpenResume={() => setIsResumeOpen(true)}
          />

          {/* Main Single-Page Experience */}
          <main>
            {/* Section 2: Hero */}
            <HeroSection isReady={!isLoading} />

            {/* Section 3: Selected Works */}
            <SelectedWorksSection
              onSelectProject={(project) => setSelectedProject(project)}
            />

            {/* Section 4: Journal */}
            <JournalSection
              onSelectArticle={(article) => setSelectedArticle(article)}
            />

            {/* Section 5: Explorations (Parallax Gallery) */}
            <ExplorationsSection
              onSelectExploration={(item) => {
                const idx = EXPLORATION_ITEMS.findIndex((e) => e.id === item.id);
                setSelectedExplorationIdx(idx >= 0 ? idx : 0);
              }}
            />

            {/* Section 6: Stats */}
            <StatsSection />
          </main>

          {/* Section 7: Contact / Footer */}
          <ContactFooterSection />

          {/* Interactive Modals */}
          <ProjectCaseStudyModal
            project={selectedProject}
            onClose={() => setSelectedProject(null)}
          />

          <ArticleReaderModal
            article={selectedArticle}
            onClose={() => setSelectedArticle(null)}
          />

          <ExplorationLightboxModal
            item={
              selectedExplorationIdx !== null
                ? EXPLORATION_ITEMS[selectedExplorationIdx]
                : null
            }
            onClose={() => setSelectedExplorationIdx(null)}
            onNavigate={handleNavigateLightbox}
          />

          <ResumeModal
            isOpen={isResumeOpen}
            onClose={() => setIsResumeOpen(false)}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
